trigger:
  branches:
    include:
      - main
      - develop

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  REGISTRY: ghcr.io
  IMAGE_A: ghcr.io/nahueldlsl/lab06-so-dummy-a
  IMAGE_B: ghcr.io/nahueldlsl/lab06-so-dummy-b

stages:
  # ── Stage 1: Test ──────────────────────────────────────────────────────────
  - stage: Test
    displayName: Lint & Test
    jobs:
      - job: TestDummyB
        displayName: Lint & Test — Dummy B (Flask API)
        steps:
          - checkout: self

          - task: UsePythonVersion@0
            inputs:
              versionSpec: "3.12"

          - script: |
              cd app/dummy-b
              pip install -r requirements.txt
              pip install flake8
            displayName: Install dependencies

          - script: flake8 app/dummy-b --max-line-length=100 --statistics
            displayName: Lint with flake8

          - script: |
              cd app/dummy-b
              python -m pytest tests/ -v --tb=short \
                --junitxml=$(Build.ArtifactStagingDirectory)/test-results.xml
            displayName: Run tests

          - task: PublishTestResults@2
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: $(Build.ArtifactStagingDirectory)/test-results.xml
            condition: always()
            displayName: Publish test results

  # ── Stage 2: Build & Push (solo en main) ──────────────────────────────────
  - stage: BuildPush
    displayName: Build & Push Docker Images
    dependsOn: Test
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: BuildAndPush
        displayName: Build & push to ghcr.io
        steps:
          - checkout: self

          - script: |
              echo "$(GHCR_TOKEN)" | docker login ghcr.io -u "$(GHCR_USER)" --password-stdin
            displayName: Log in to ghcr.io

          - script: |
              docker build -t $(IMAGE_A):latest \
                           -t $(IMAGE_A):$(Build.SourceVersion) \
                           app/dummy-a
              docker push $(IMAGE_A):latest
              docker push $(IMAGE_A):$(Build.SourceVersion)
            displayName: Build & push dummy-a

          - script: |
              docker build -t $(IMAGE_B):latest \
                           -t $(IMAGE_B):$(Build.SourceVersion) \
                           app/dummy-b
              docker push $(IMAGE_B):latest
              docker push $(IMAGE_B):$(Build.SourceVersion)
            displayName: Build & push dummy-b
