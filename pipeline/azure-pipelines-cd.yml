trigger: none

resources:
  pipelines:
    - pipeline: ci
      source: lab06-CI
      trigger:
        branches:
          include:
            - main

pool:
  vmImage: ubuntu-latest

stages:
  - stage: Deploy
    displayName: Deploy to Server
    jobs:
      - deployment: DeployToServer
        displayName: Docker Compose deploy via SSH
        environment: production
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: InstallSSHKey@0
                  inputs:
                    knownHostsEntry: $(SSH_KNOWN_HOSTS)
                    sshPublicKey: $(SSH_PUBLIC_KEY)
                    sshKeySecureFile: deploy_key.pem
                  displayName: Install SSH key

                - script: |
                    scp -i $(Agent.TempDirectory)/deploy_key.pem \
                        docker-compose.yml \
                        scripts/deploy.sh \
                        $(SSH_USER)@$(SSH_HOST):/opt/lab06/
                  displayName: Copy files to server

                - script: |
                    ssh -i $(Agent.TempDirectory)/deploy_key.pem \
                        $(SSH_USER)@$(SSH_HOST) \
                        "GHCR_TOKEN='$(GHCR_TOKEN)' GHCR_USER='$(GHCR_USER)' bash /opt/lab06/deploy.sh"
                  displayName: Deploy

                - script: |
                    curl -sf http://$(SSH_HOST)/ | grep -q "Hola Mundo DevOps" \
                      && echo "dummy-a: PASS" || { echo "dummy-a: FAIL"; exit 1; }
                    STATUS=$(curl -sf -o /dev/null -w "%{http_code}" http://$(SSH_HOST):8080/health)
                    [ "$STATUS" = "200" ] \
                      && echo "dummy-b: PASS" || { echo "dummy-b: FAIL"; exit 1; }
                  displayName: Smoke tests
