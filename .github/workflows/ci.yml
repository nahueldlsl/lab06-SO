name: CI — Test & Build Docker Images

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  packages: write

jobs:
  # ── Tests (siempre, en push y PR) ──────────────────────────────────────────
  test:
    name: Lint & Test — Dummy B (Flask API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/dummy-b/requirements.txt

      - name: Install dependencies
        run: |
          cd app/dummy-b
          pip install -r requirements.txt
          pip install flake8

      - name: Lint
        run: flake8 app/dummy-b --max-line-length=100 --statistics

      - name: Run tests
        run: |
          cd app/dummy-b
          python -m pytest tests/ -v --tb=short

  # ── Build & push (solo en push a main) ────────────────────────────────────
  build-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push dummy-a
        uses: docker/build-push-action@v6
        with:
          context: app/dummy-a
          push: true
          tags: |
            ghcr.io/nahueldlsl/lab06-so-dummy-a:latest
            ghcr.io/nahueldlsl/lab06-so-dummy-a:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push dummy-b
        uses: docker/build-push-action@v6
        with:
          context: app/dummy-b
          push: true
          tags: |
            ghcr.io/nahueldlsl/lab06-so-dummy-b:latest
            ghcr.io/nahueldlsl/lab06-so-dummy-b:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
