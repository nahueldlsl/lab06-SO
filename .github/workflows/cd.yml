name: CD — Deploy to Server

on:
  workflow_run:
    workflows: ["CI — Test & Build Docker Images"]
    types: [completed]
    branches: ["main"]

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment: production

    steps:
      - uses: actions/checkout@v4

      # ── Configurar SSH ─────────────────────────────────────────────────────
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # ── Copiar archivos al servidor ────────────────────────────────────────
      - name: Copy files to server
        run: |
          ssh -i ~/.ssh/deploy_key \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
              "mkdir -p /opt/lab06"
          scp -i ~/.ssh/deploy_key \
              docker-compose.yml \
              scripts/deploy.sh \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/lab06/

      # ── Ejecutar despliegue ────────────────────────────────────────────────
      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
              "GHCR_TOKEN='${{ secrets.GITHUB_TOKEN }}' \
               GHCR_USER='${{ github.actor }}' \
               bash /opt/lab06/deploy.sh"

      # ── Smoke tests desde el runner ────────────────────────────────────────
      - name: Smoke test — Dummy A (port 80)
        run: |
          curl -sf http://${{ secrets.SSH_HOST }}/ \
            | grep -q "Hola Mundo DevOps" \
            && echo "Dummy A: PASS" \
            || { echo "Dummy A: FAIL"; exit 1; }

      - name: Smoke test — Dummy B /health (port 8080)
        run: |
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" \
            http://${{ secrets.SSH_HOST }}:8080/health)
          [ "$STATUS" = "200" ] \
            && echo "Dummy B: PASS (HTTP $STATUS)" \
            || { echo "Dummy B: FAIL (HTTP $STATUS)"; exit 1; }
